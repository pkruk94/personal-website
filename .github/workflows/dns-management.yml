name: DNS record management

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - apply
          - destroy

jobs:
  dns:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DNS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform/dns
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: terraform/dns
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/dns
        run: terraform plan -var-file=environments/prod.tfvars ${{ inputs.action == 'destroy' && '-destroy' || '' }}

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform/dns
        run: terraform apply -var-file=environments/prod.tfvars -auto-approve

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: terraform/dns
        run: terraform destroy -var-file=environments/prod.tfvars -auto-approve